[package]
name = "rde"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RDE desktop app (prototype)"

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
rde-core = { workspace = true }
rde-ui = { workspace = true }
# M1: headless MCP-сервер (`rde mcp serve`) — протокольный слой + реализация контракта.
rde-mcp = { workspace = true }
rde-host = { workspace = true }

[dev-dependencies]
# E2E `mcp serve` настоящим rmcp-клиентом: stdio (M1/M2/M2.5) и streamable HTTP (M3).
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { workspace = true, features = ["macros", "process", "time"] }
serde_json = { workspace = true }
# Клиент streamable HTTP для e2e (rmcp-клиент принимает reqwest::Client).
reqwest = { workspace = true }
# M4.3: e2e настоящего DSH по ACP (`dsh --profile acp`) через клиент rde-agent.
rde-agent = { workspace = true }
