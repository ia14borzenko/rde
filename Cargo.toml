[workspace]
resolver = "3"
members = ["apps/rde", "crates/rde-core", "crates/rde-dag", "crates/rde-doc", "crates/rde-docx", "crates/rde-env", "crates/rde-hash", "crates/rde-host", "crates/rde-mcp", "crates/rde-run", "crates/rde-sources", "crates/rde-store", "crates/rde-templates", "crates/rde-ui", "crates/rde-vcs", "xtask"]
# WordCraft vendored as a submodule keeps its own Cargo workspace (workspace-inherited
# dependencies like `chrono = { workspace = true }`); the outer workspace must not
# claim it, or those fields would inherit from RDE's manifest.
exclude = ["vendor/wordcraft", "vendor/craft-libs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# model/manifests
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
schemars = "1"
jsonschema = "0.60"
ulid = "3"
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.13"
resvg = { version = "0.45", default-features = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Агентная подсистема v0.3 (M1–M3): MCP по официальному Rust SDK. Пин точный: контракт
# генерации схем/`server/discover`-типов у rmcp меняется между минорными версиями.
# M3: streamable HTTP-транспорт (server) — opt-in, loopback + bearer-токен (R-MCP-02).
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "signal"] }
async-trait = "0.1"
# M3: HTTP-транспорт MCP — сервер на axum (тот же стек, что рекомендуют примеры rmcp).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# M3: клиент для e2e (rmcp-клиент streamable HTTP использует reqwest; TLS на loopback не нужен).
reqwest = { version = "0.13", default-features = false }
# M3: криптостойкий токен сессии (getrandom — тот же источник, что у rand/ring).
getrandom = "0.3"

egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "default_fonts",
    "accesskit",
] }
rde-core = { path = "crates/rde-core" }
rde-dag = { path = "crates/rde-dag" }
rde-doc = { path = "crates/rde-doc" }
rde-docx = { path = "crates/rde-docx" }
rde-templates = { path = "crates/rde-templates" }
rde-vcs = { path = "crates/rde-vcs" }
rde-sources = { path = "crates/rde-sources" }
rde-env = { path = "crates/rde-env" }
rde-hash = { path = "crates/rde-hash" }
rde-run = { path = "crates/rde-run" }
rde-store = { path = "crates/rde-store" }
rde-ui = { path = "crates/rde-ui" }
rde-mcp = { path = "crates/rde-mcp" }
rde-host = { path = "crates/rde-host" }
wordcraft-engine = { path = "vendor/wordcraft/crates/engine" }

# WordCraft pins krilla itself in its own workspace; patches of a dependency's
# workspace do not apply when it is built as a path dependency, so RDE mirrors it.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }

# Экономия места: без полного debug-info (символы для backtrace остаются).
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
