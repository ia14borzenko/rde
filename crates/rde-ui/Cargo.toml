[package]
name = "rde-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RDE prototype UI shell: project tree, tabs, document preview (real WordCraft rendering), agent panel"

[dependencies]
egui = { workspace = true }
image = { workspace = true }
rde-core = { workspace = true }
rde-dag = { workspace = true }
rde-doc = { workspace = true }
rde-env = { workspace = true }
rde-hash = { workspace = true }
rde-templates = { workspace = true }
rde-vcs = { workspace = true }
rde-sources = { workspace = true }
zip = { workspace = true }
rde-run = { workspace = true }
rde-store = { workspace = true }
# M4.1: встроенный MCP-сервер (streamable HTTP) для внешних агентов.
rde-mcp = { workspace = true }
rde-host = { workspace = true }
# M4.2: GUI-approvals — async-хук ждёт решения пользователя в blocking-пуле tokio.
tokio = { workspace = true }
async-trait = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { path = "../../vendor/wordcraft/crates/ui-egui", features = ["rde-docview"] }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
rde-docx = { workspace = true }
# Проверка глифов строк таблиц (тест structure_and_insert_strings_have_glyphs); версия как в Cargo.lock.
ttf-parser = "0.25"
