[package]
name = "rde-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RDE document package (M3): .doc.rde = OOXML + rde:doc customXml part, save/load, caption updates, docx extraction"

[dependencies]
rde-core = { workspace = true }
rde-hash = { workspace = true }
rde-store = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
wordcraft-engine = { workspace = true }
# Бандл math-шрифта формул (STIX Two Math, OFL 1.1): регистрация в FontDb (ADR-0018).
wordcraft-fonts = { workspace = true }
# R-DOC-44: OLE Compound File (MathType `Equation Native` при импорте .docx).
cfb = { workspace = true }
# Кроп SVG-кэшей формул: растровый ink-bbox из PDF (скобки/линии рисуются путями, не текстом).
image = { workspace = true }

[dev-dependencies]
rde-dag = { workspace = true }
